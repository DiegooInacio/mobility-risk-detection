[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mobility-risk-detection"
version = "0.1.0"
description = "POC experimental de obstáculos frontais com profundidade monocular"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
model = ["torch>=2.2,<3", "transformers>=4.42,<5", "safetensors>=0.4"]

[project.scripts]
mobility-risk = "mobility_risk.cli:main"

[tool.setuptools.packages.find]
where = ["ai"]
